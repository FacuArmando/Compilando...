{% macro feedback_icon(choice) -%}
{% set up = choice == 'si' %}
<span class="feedback-icon" aria-hidden="true">
  <svg class="feedback-hand" viewBox="0 0 24 24" fill="currentColor" focusable="false">
    <g{% if not up %} transform="rotate(180 12 12)"{% endif %}>
      <path d="m8 10.5 3.4-6.4c.4-.8 1.5-.9 2-.2 1.1 1.6.8 3.9-.2 6.1H19a2 2 0 0 1 2 2.4l-1.4 6.2a2.4 2.4 0 0 1-2.3 1.9H8Z"/>
      <rect x="3" y="10.5" width="3.5" height="10" rx="1.3" opacity=".6"/>
    </g>
  </svg>
  <span class="feedback-burst">
    {% for _ in range(8 if up else 6) %}
    <i class="feedback-particle"></i>
    {% endfor %}
  </span>
</span>
{%- endmacro %}
