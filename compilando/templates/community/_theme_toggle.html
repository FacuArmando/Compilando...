<button class="theme-toggle" type="button" role="switch" aria-checked="false"
        {{ i18n_attr("aria-label", "Modo oscuro") }} {{ i18n_attr("title", "Activar modo oscuro") }} data-theme-toggle hidden>
  <span class="theme-toggle-track" aria-hidden="true">
    <svg class="theme-toggle-stars" viewBox="0 0 64 34" fill="currentColor">
      <circle cx="43" cy="10" r="1"/><circle cx="52" cy="19" r="1.4"/><circle cx="40" cy="24" r=".8"/>
    </svg>
    <span class="theme-toggle-thumb">
      <svg class="theme-toggle-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <circle cx="12" cy="12" r="3.7"/>
        <path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
      <svg class="theme-toggle-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.3 14.2A8.5 8.5 0 0 1 9.8 3.7a8.5 8.5 0 1 0 10.5 10.5Z"/>
      </svg>
    </span>
  </span>
</button>
