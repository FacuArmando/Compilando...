{% extends 'base.html' %}
{% block title %}Crear una cuenta · COMPILANDO...{% endblock %}
{% block content %}
<section class="auth-card" aria-labelledby="register-title">
  <a class="back-link" href="{{ url_for('system.index') }}">← Volver al inicio</a>
  <h1 id="register-title">Crear una cuenta</h1>
  <p>Sumate a la comunidad de COMPILANDO...</p>

  {% if error %}
    <p class="form-error" role="alert">{{ error }}</p>
  {% endif %}

  <form action="{{ url_for('auth.register') }}" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="field">
      <label for="username">Nombre de usuario</label>
      <input id="username" name="username" type="text" autocomplete="username"
             maxlength="80" placeholder="Tu nombre de usuario" value="{{ username }}" required>
    </div>

    <div class="field">
      <label for="email">Correo electrónico</label>
      <input id="email" name="email" type="email" autocomplete="email"
             maxlength="254" placeholder="nombre@ejemplo.com" value="{{ email }}" required>
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password"
             autocomplete="new-password" minlength="8" maxlength="128"
             aria-describedby="password-hint" required>
      <small id="password-hint" class="form-note">Entre 8 y 128 caracteres.</small>
    </div>

    <button class="button button-primary" type="submit">
      Crear cuenta
    </button>
  </form>
</section>
{% endblock %}
