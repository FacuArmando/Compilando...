<div class="auth-screen">
  {% include 'auth/_visual.html' %}

  <section class="auth-panel" aria-labelledby="login-title">
    <div class="auth-content">
      <a class="back-link" href="{{ url_for('system.index') }}">← Volver al inicio</a>
      <h1 id="login-title">Iniciar sesión</h1>
      <p class="auth-intro">Ingresá con tu cuenta y sumate a la conversación.</p>

      {% for message in get_flashed_messages(category_filter=['success']) %}
        <p class="notice" role="status">{{ message }}</p>
      {% endfor %}

      {% if error %}
        <p class="form-error" role="alert">{{ error }}</p>
      {% endif %}

      <form class="auth-form" action="{{ url_for('auth.login') }}" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="next" value="{{ next_url|default(url_for('system.index')) }}">

        <div class="field">
          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" autocomplete="username"
                 maxlength="254" placeholder="nombre@ejemplo.com"
                 value="{{ email|default('') }}" required>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password"
                 autocomplete="current-password" maxlength="128" required>
          <button class="password-toggle" type="button" data-password-toggle="password"
                  aria-controls="password" aria-pressed="false" hidden>Mostrar contraseña</button>
        </div>

        <button class="button button-primary" type="submit">Ingresar</button>
      </form>

      <p class="auth-switch">
        ¿No tenés cuenta? <a href="{{ url_for('auth.register', next=next_url if next_url|default('/') != '/' else none) }}">Registrate</a>
      </p>
    </div>
  </section>
</div>
